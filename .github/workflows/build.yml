name: Build Windows executable

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore, test and publish (scripts/build-release.ps1)
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Upload build artifact (exe + dependencies, zipped)
        uses: actions/upload-artifact@v4
        with:
          name: RpaVersionControl-win-x64
          path: artifacts/RpaVersionControl-win-x64.zip
          if-no-files-found: error
