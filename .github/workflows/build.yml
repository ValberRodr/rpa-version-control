name: Build Windows executable

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore, test and publish (scripts/build-release.ps1)
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Upload build artifact (exe + dependencies, zipped)
        uses: actions/upload-artifact@v4
        with:
          name: RpaVersionControl-win-x64
          path: artifacts/RpaVersionControl-win-x64.zip
          if-no-files-found: error

      - name: Publish/update "latest" GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Build mais recente
          body: |
            Build automático gerado a partir do commit ${{ github.sha }}.

            Baixe `RpaVersionControl-win-x64.zip`, extraia e execute `RpaVersionControl.App.exe`.
            Antes de distribuir, ajuste o `shared-root.txt` incluído no zip para apontar para a
            pasta compartilhada da sua rede.
          files: artifacts/RpaVersionControl-win-x64.zip
          make_latest: true
